name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please cuts the tag with the default GITHUB_TOKEN. GitHub does not
  # start a new workflow run for events raised by that token, so a plain
  # `on: push: tags:` trigger on goreleaser.yml never fires (verified: 6 tags
  # pushed by the previous commitizen workflow produced 0 Release runs).
  # Calling the release workflow directly is the reliable bridge.
  release-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/goreleaser.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
