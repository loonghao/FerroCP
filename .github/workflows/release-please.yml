name: Release Please

on:
  push:
    branches:
      - main
  # Manual re-run of the release PR grooming, e.g. to refresh Cargo.lock on a
  # release PR that predates the `sync-cargo-lock` job. Safe to re-run:
  # release-please only cuts a tag once the release PR is merged.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # A release PR raised with the default GITHUB_TOKEN is attributed to
    # app/github-actions, and this repository requires first-time-contributor
    # workflow runs to be approved. Every run sat at conclusion=action_required
    # with zero jobs, so no check ever reported and the PR looked permanently
    # unmergeable (release PR #121 stalled for over six days this way).
    #
    # Set RELEASE_PLEASE_TOKEN to a PAT with `repo` and `workflow` scope to
    # attribute the release PR to a real user, which clears the gate. Without
    # the secret the workflow keeps its previous behaviour rather than failing.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please rewrites `[workspace.package] version` in Cargo.toml but never
  # invokes cargo, so Cargo.lock kept the pre-bump version and every `--locked` /
  # `--frozen` / `--offline` build of the release branch failed -- on a repository
  # that only just started committing the lock file.
  #
  # `cargo update --workspace` rewrites only the workspace member entries
  # ("Locking 11 packages"): every third-party pin is left exactly as reviewed.
  sync-cargo-lock:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve the release PR branch
        id: branch
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')"
          if [ -z "$branch" ]; then
            # The action only emits `pr` when it actually created or updated the
            # release PR; an already up-to-date PR emits nothing. Fall back to the
            # deterministic manifest-mode branch name and confirm an open PR uses
            # it before touching anything.
            branch="release-please--branches--main"
            if [ "$(gh pr view "$branch" --json state --jq '.state')" != "OPEN" ]; then
              echo "::notice::No open release PR on ${branch}, nothing to sync"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out the release PR branch
        if: steps.branch.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        if: steps.branch.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh Cargo.lock for the bumped workspace version
        if: steps.branch.outputs.skip != 'true'
        run: cargo update --workspace

      - name: Verify the lock file is consistent
        if: steps.branch.outputs.skip != 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Commit and push the refreshed lock file
        if: steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the manifests, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock with the release version bump"
          # Push with the same token that opened the release PR. A push made with
          # the default GITHUB_TOKEN would leave the follow-up run queued behind
          # the manual-approval gate, which is what stalled release PR #121.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

  # release-please cuts the tag with the default GITHUB_TOKEN. GitHub does not
  # start a new workflow run for events raised by that token, so a plain
  # `on: push: tags:` trigger on goreleaser.yml never fires (verified: 6 tags
  # pushed by the previous commitizen workflow produced 0 Release runs).
  # Calling the release workflow directly is the reliable bridge.
  release-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/goreleaser.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
