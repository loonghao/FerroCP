name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Lint levels follow the `.cargo/config.toml` `dev-clippy` alias: correctness,
  # suspicious and complexity are blocking, perf and style stay advisory.
  #
  # Note: do NOT use `-D warnings` here. The `[workspace.lints.clippy]` table in
  # the root Cargo.toml deliberately allows a long list of style lints
  # (must_use_candidate, cast_precision_loss, doc_markdown, ...) and command-line
  # lint flags override manifest levels, so `-D warnings` would silently
  # resurrect every one of them and bury real findings in noise.
  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- \
            -D clippy::correctness \
            -D clippy::suspicious \
            -D clippy::complexity \
            -W clippy::perf \
            -W clippy::style

  # `cargo check --workspace --all-targets --all-features` is the gate that was
  # missing: --workspace every crate and --all-targets every target (benches and
  # examples included). Building only `--bin ferrocp`, or checking a single
  # package, is what let the workspace sit uncompilable without anyone noticing.
  #
  # `cargo test --workspace` then runs lib, integration and doc tests. Benchmarks
  # are compiled by the step above but not executed here: they are criterion
  # harnesses, not correctness checks.
  rust-test:
    name: Rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev lld clang

      - name: Check every crate and target
        run: cargo check --workspace --all-targets --all-features

      # Deliberately without `--all-features` (unlike the check step above).
      # `ferrocp-python`'s `extension-module` feature turns on
      # `pyo3/extension-module`, which stops the cdylib from linking against
      # libpython; the crate's own Cargo.toml documents that this feature must
      # stay off for `cargo test`. No test in the workspace is currently gated
      # behind a non-default feature, so nothing is lost today. When one is,
      # add a dedicated `cargo test -p <crate> --features <f>` step rather than
      # flipping `--all-features` on here.
      - name: Run tests
        run: cargo test --workspace

  # Dependency gate. `deny.toml` and `.cargo/audit.toml` hold the accepted-risk
  # list (currently RUSTSEC-2025-0141, the unmaintained `bincode`); both are
  # wired in here so new advisories and license/ban violations block the PR.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: deny

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --no-install-project: linting only needs the lint tools, not a compiled
      # `ferrocp` extension module. Building the project here would make this job
      # report the extension build status instead of the lint status.
      - name: Install lint dependencies
        run: uv sync --group linting --no-install-project

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run mypy
        run: uv run --no-sync mypy python/ferrocp --strict

  # The Python bindings are covered by two jobs: `python-build` below (build
  # plus import check) and `python-test`, which runs the library test suite.
  # The end-to-end suite, which needs both a built CLI binary and the extension
  # module, has its own `e2e` job further down.
  #
  # `nox -s test` is deliberately not the driver here. Its `install_with_groups`
  # shells out to `uv sync`, and uv ignores the session's `VIRTUAL_ENV` ("does
  # not match the project environment path `.venv` and will be ignored; use
  # `--active`"), so the test dependencies land in `.venv` while nox runs
  # `maturin` and `pytest` from `.nox/test-3.X`. It also fans out over four
  # interpreters, each triggering a full release build under the workspace's
  # `lto = "fat", codegen-units = 1` profile.
  #
  # `python-build` guards the part that broke in practice and that the Rust jobs
  # do not cover: linking the cdylib against pyo3's abi3 import library without
  # libpython (the `extension-module` feature), which `cargo check` never
  # exercises.
  python-build:
    name: Python extension build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Pin the interpreter: `requires-python = ">=3.9"` alone lets uv resolve
      # to a CPython newer than the declared support matrix.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: python-build-${{ matrix.os }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev lld clang

      # --no-install-project keeps this job from building the extension twice:
      # `uv sync` would otherwise run the maturin PEP 517 backend before
      # `maturin develop` runs it again.
      - name: Install build dependencies
        run: uv sync --group testing --no-install-project

      # Debug profile on purpose. This job checks the pyo3 link step, not
      # release performance, and the workspace release profile is
      # `lto = "fat", codegen-units = 1`, which costs hours on a hosted runner.
      - name: Build the extension module
        run: uv run --no-sync maturin develop

      - name: Import the extension module
        run: |
          uv run --no-sync python -c "import ferrocp; print(ferrocp.__version__); assert ferrocp.__version__"

  # Runs the library test suite. `tests/e2e` is excluded on purpose: it needs a
  # built CLI binary as well as the extension module, and the `e2e` job below
  # runs it on all three platforms instead.
  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: python-test-ubuntu

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev lld clang

      - name: Install test dependencies
        run: uv sync --group testing --no-install-project

      - name: Build the extension module
        run: uv run --no-sync maturin develop

      - name: Run the library test suite
        run: >
          uv run --no-sync pytest tests --ignore=tests/e2e -v
          -W error::RuntimeWarning

  # End-to-end suite. This is the only job that drives the artifacts users
  # actually install: the CLI binary built from this commit, and the Python
  # extension module built alongside it. Every copy hits the real filesystem -
  # there is no mock filesystem anywhere under tests/e2e.
  #
  # It runs on all three platforms because `docs/COPY_SEMANTICS.md` documents a
  # per-platform behaviour matrix (§5) and a suite that only ran on one platform
  # could not tell you when the matrix had drifted. Where a row genuinely cannot
  # be exercised on a given platform, the test says which case applied instead of
  # silently passing: `tests/e2e/test_platform_matrix.py` skips the Unix-only and
  # Windows-only rows with named reasons, and
  # `tests/e2e/test_symlinks.py::test_symlink_creation_failure_is_reported_not_dropped`
  # asserts the documented behaviour for machines that cannot create symlinks
  # (Windows without Developer Mode or elevation) rather than skipping.
  #
  # The CLI binary is built here and passed to the suite through
  # FERROCP_E2E_CLI so the tests exercise exactly this build rather than
  # whatever happens to be in `target/`.
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev lld clang

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --group testing --no-install-project

      # Debug profile on purpose. This job checks behaviour, not release
      # performance, and the workspace release profile is
      # `lto = "fat", codegen-units = 1`, which costs hours on a hosted runner.
      - name: Build the extension module
        run: uv run --no-sync maturin develop

      - name: Build the CLI binary
        run: cargo build --bin ferrocp

      - name: Point the suite at this build
        shell: bash
        run: echo "FERROCP_E2E_CLI=$GITHUB_WORKSPACE/target/debug/ferrocp${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Run the end-to-end suite
        run: uv run --no-sync pytest tests/e2e -v -rs
