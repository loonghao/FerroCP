name: Test GoReleaser Configuration

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '.goreleaser.yml'
      - '.github/workflows/goreleaser.yml'
      - '.github/workflows/test-goreleaser.yml'
      - '.github/actions/**'
      - '.cargo/config.toml'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to test (optional)'
        required: false
        type: string

jobs:
  test-goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up cross-compilation toolchain
        uses: ./.github/actions/setup-cross-compile

      # Test GoReleaser configuration
      - name: Test GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The linux/amd64 binary is what `goreleaser build --snapshot
      # --single-target` packages below, so it has to exist first. The other
      # release targets are covered by the `test-release-targets` matrix.
      - name: Build ferrocp for linux/amd64
        run: |
          echo "🔧 Building ferrocp for x86_64-unknown-linux-gnu..."
          cargo zigbuild --bin ferrocp --target x86_64-unknown-linux-gnu --release

          if [ -f "target/x86_64-unknown-linux-gnu/release/ferrocp" ]; then
            echo "✅ Binary created successfully"
            ls -la target/x86_64-unknown-linux-gnu/release/ferrocp
          else
            echo "❌ Binary not found"
            exit 1
          fi

      # Test GoReleaser build (dry-run)
      - name: Test GoReleaser build (dry-run)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --single-target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-build-artifacts
          path: |
            dist/
            target/*/release/ferrocp*
          retention-days: 1

  # The Linux and Apple release targets are cross-compiled here, not just the
  # Linux one. The `Release` workflow used to build every target only at tag
  # time, so the darwin targets stayed broken (missing macOS SDK) across the
  # whole 0.4.x line with no PR-stage signal at all. This matrix surfaces that
  # class of failure on the PR instead of after the release tag is cut.
  #
  # `x86_64-pc-windows-msvc` is deliberately absent: it is not cross-compiled
  # from Linux at all (rustc emits `link.exe`-style linker arguments that zig
  # rejects with `error: /NOLOGO: unrecognized file extension`, and zig ships
  # no Windows SDK import libraries). Testing it here would only assert a
  # combination the release pipeline never uses, so it is covered by
  # `test-windows-native` below.
  test-cross-compiled-targets:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            macosx_deployment_target: ''
          - target: aarch64-unknown-linux-gnu
            macosx_deployment_target: ''
          - target: x86_64-apple-darwin
            macosx_deployment_target: '12.0'
          - target: aarch64-apple-darwin
            macosx_deployment_target: '11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up cross-compilation toolchain
        uses: ./.github/actions/setup-cross-compile

      - name: Cross-compile ferrocp for ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          cargo zigbuild --bin ferrocp --target "${{ matrix.target }}" --release

          if [ -f "target/${{ matrix.target }}/release/ferrocp" ] || [ -f "target/${{ matrix.target }}/release/ferrocp.exe" ]; then
            echo "✅ Binary produced for ${{ matrix.target }}"
            ls -la "target/${{ matrix.target }}/release/"
          else
            echo "❌ No binary produced for ${{ matrix.target }}"
            exit 1
          fi

  # Mirrors the `build-windows` job of the `Release` workflow: the Windows
  # artifact is produced natively on a Windows runner, exactly as it is at
  # release time.
  test-windows-native:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build ferrocp for x86_64-pc-windows-msvc
        run: cargo build --bin ferrocp --target x86_64-pc-windows-msvc --release

      - name: Verify binary
        shell: bash
        run: |
          if [ -f "target/x86_64-pc-windows-msvc/release/ferrocp.exe" ]; then
            echo "✅ Binary produced for x86_64-pc-windows-msvc"
            ls -la target/x86_64-pc-windows-msvc/release/ferrocp.exe
          else
            echo "❌ No binary produced for x86_64-pc-windows-msvc"
            exit 1
          fi

  test-cross-compilation-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test zigbuild cross-compilation script
        run: |
          echo "🧪 Testing zigbuild cross-compilation script..."
          chmod +x scripts/zigbuild-cross.sh

          # Test script help
          ./scripts/zigbuild-cross.sh --help

          # Test single target build
          ./scripts/zigbuild-cross.sh --target x86_64-unknown-linux-gnu --verbose

          echo "✅ Cross-compilation script test completed!"

  test-makefile-targets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test Makefile targets
        run: |
          echo "🧪 Testing Makefile targets..."

          # Test help target
          make help | grep "build-cross"

          echo "✅ Makefile targets test completed!"

  summary:
    runs-on: ubuntu-latest
    needs: [test-goreleaser, test-cross-compiled-targets, test-windows-native, test-cross-compilation-scripts, test-makefile-targets]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## 🧪 GoReleaser Configuration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-goreleaser.result }}" == "success" ]; then
            echo "✅ **GoReleaser Configuration**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **GoReleaser Configuration**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-cross-compiled-targets.result }}" == "success" ]; then
            echo "✅ **Linux + Apple Cross-Compilation**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Linux + Apple Cross-Compilation**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-windows-native.result }}" == "success" ]; then
            echo "✅ **Windows Native Build**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Windows Native Build**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-cross-compilation-scripts.result }}" == "success" ]; then
            echo "✅ **Cross-compilation Scripts**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Cross-compilation Scripts**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-makefile-targets.result }}" == "success" ]; then
            echo "✅ **Makefile Targets**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Makefile Targets**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Test Details" >> $GITHUB_STEP_SUMMARY
          echo "- GoReleaser configuration syntax validation" >> $GITHUB_STEP_SUMMARY
          echo "- Cross-compilation for every Linux and Apple release target" >> $GITHUB_STEP_SUMMARY
          echo "- Native Windows build for x86_64-pc-windows-msvc" >> $GITHUB_STEP_SUMMARY
          echo "- Script functionality and help output" >> $GITHUB_STEP_SUMMARY
          echo "- Makefile target availability" >> $GITHUB_STEP_SUMMARY
