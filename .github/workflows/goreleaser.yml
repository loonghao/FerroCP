name: Release

permissions:
  contents: write

on:
  # Called by release-please.yml right after it cuts a release tag.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (a vX.Y.Z tag) to build and publish'
        required: true
        type: string
      dry-run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (a vX.Y.Z tag) to build and publish; empty = current ref'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      # Install cross-compilation dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            binutils \
            lld \
            clang \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ inputs.dry-run && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
