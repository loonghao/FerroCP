name: Release

permissions:
  contents: write

on:
  # Called by release-please.yml right after it cuts a release tag.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (a vX.Y.Z tag) to build and publish'
        required: true
        type: string
      dry-run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (a vX.Y.Z tag) to build and publish; empty = current ref'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Build only, do not publish'
        required: false
        default: false
        type: boolean

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      # Installed here as well as in the GoReleaser `before` hooks below,
      # because the binaries are built before GoReleaser runs.
      - name: Set up cross-compilation toolchain
        uses: ./.github/actions/setup-cross-compile

      # Cross-compile the Rust CLI for every release target, sequentially.
      #
      # This deliberately does not use GoReleaser `pre` hooks: those run
      # concurrently, and parallel `cargo zigbuild` invocations sharing one
      # target directory race on cargo's `target/.rustc_info.json` and abort
      # with `Error: File exists (os error 17)`. GoReleaser then only packages
      # these binaries.
      #
      # The Apple targets pin MACOSX_DEPLOYMENT_TARGET explicitly: rustc
      # defaults x86_64-apple-darwin to 10.12, which is below the 10.13
      # minimum the bundled macOS SDK accepts.
      - name: Cross-compile ferrocp for all release targets
        run: |
          cargo zigbuild --bin ferrocp --target x86_64-unknown-linux-gnu --release
          cargo zigbuild --bin ferrocp --target aarch64-unknown-linux-gnu --release
          MACOSX_DEPLOYMENT_TARGET=12.0 cargo zigbuild --bin ferrocp --target x86_64-apple-darwin --release
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo zigbuild --bin ferrocp --target aarch64-apple-darwin --release
          cargo zigbuild --bin ferrocp --target x86_64-pc-windows-msvc --release

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ inputs.dry-run && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
