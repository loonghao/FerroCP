# GoReleaser configuration for FerroCP
# See: https://goreleaser.com/customization/

# GoReleaser v2 configuration
version: 2

# Project metadata
project_name: ferrocp

# Environment variables
env:
  - GO111MODULE=on  # Enable Go modules for GoReleaser compatibility

# Before hooks - run before building
before:
  hooks:
    # Install cargo-zigbuild for optimized cross-compilation
    - cargo install --locked cargo-zigbuild
    # Install zig toolchain via pip (includes ziglang)
    - pip install ziglang
    # Add all VFX Platform supported targets
    - rustup target add x86_64-pc-windows-msvc
    - rustup target add x86_64-unknown-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu
    - rustup target add x86_64-apple-darwin
    - rustup target add aarch64-apple-darwin
    # Run basic checks
    - cargo fmt --all -- --check
    # Create go.sum file for GoReleaser compatibility
    - touch go.sum
    #
    # The Rust CLI is cross-compiled by the release workflow, not by a hook
    # here. GoReleaser runs the per-build `pre` hooks concurrently, so building
    # there makes five `cargo zigbuild` invocations share one target directory
    # and race on cargo's `target/.rustc_info.json` (`Error: File exists (os
    # error 17)`); and `before` hooks would also run for the
    # `goreleaser build` smoke test, which only wants a single target. Each
    # build below just copies the binary the workflow already produced.

# Build configuration for Rust binaries following VFX Platform standards
builds:
  # Linux x86_64 - VFX Platform CY2025: gcc 11.2.1+, glibc 2.28+
  - id: ferrocp-linux-amd64
    binary: ferrocp
    main: ./scripts/fake-main.go
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
      - BLAKE3_NO_ASM=1
    hooks:
      post: cp target/x86_64-unknown-linux-gnu/release/ferrocp {{ .Path }}

  # Linux ARM64 - Modern VFX workflows (Cross-compiled)
  - id: ferrocp-linux-arm64
    binary: ferrocp
    main: ./scripts/fake-main.go
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
      - BLAKE3_NO_ASM=1
    hooks:
      post: cp target/aarch64-unknown-linux-gnu/release/ferrocp {{ .Path }}

  # macOS x86_64 - VFX Platform CY2025: macOS 12.0+ minimum deployment target
  - id: ferrocp-darwin-amd64
    binary: ferrocp
    main: ./scripts/fake-main.go
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
      - MACOSX_DEPLOYMENT_TARGET=12.0
    hooks:
      post: cp target/x86_64-apple-darwin/release/ferrocp {{ .Path }}

  # macOS ARM64 (Apple Silicon) - VFX Platform CY2025+
  #
  # `MACOSX_DEPLOYMENT_TARGET` is a declaration here, not a build input: GoReleaser
  # only compiles `scripts/fake-main.go` with `CGO_ENABLED=0`, and the `post` hook
  # copies in the Rust binary that the release workflow already cross-compiled. The
  # minimum OS version actually welded into the shipped artifact comes from the
  # `MACOSX_DEPLOYMENT_TARGET` env of `.github/workflows/goreleaser.yml`, mirrored
  # by the `test-cross-compiled-targets` matrix in `test-goreleaser.yml`; keep the
  # three in sync so this file documents what ships.
  #
  # arm64 is 11.0 because every Apple Silicon Mac ships at least macOS 11.0 (Big
  # Sur), one major lower than the Intel target, which follows VFX Platform CY2025
  # at 12.0. Raising either value would only shrink the supported user base, so the
  # workflow stays the source of truth and this block follows it.
  - id: ferrocp-darwin-arm64
    binary: ferrocp
    main: ./scripts/fake-main.go
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
      - MACOSX_DEPLOYMENT_TARGET=11.0
    hooks:
      post: cp target/aarch64-apple-darwin/release/ferrocp {{ .Path }}

  # Windows x86_64 - VFX Platform CY2025: VS 2022 v17.6+, Windows SDK 10.0.20348+
  - id: ferrocp-windows-amd64
    binary: ferrocp
    main: ./scripts/fake-main.go
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    hooks:
      post: cp target/x86_64-pc-windows-msvc/release/ferrocp.exe {{ .Path }}



# Archive configuration for VFX Platform distributions
archives:
  - id: ferrocp-archives
    ids:
      - ferrocp-linux-amd64
      - ferrocp-linux-arm64
      - ferrocp-darwin-amd64
      - ferrocp-darwin-arm64
      - ferrocp-windows-amd64
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    files:
      - README.md
      - README_zh.md
      - LICENSE*
      - docs/VFX_PLATFORM_COMPATIBILITY.md

# Checksum configuration
checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
  algorithm: sha256

# Snapshot configuration (for non-tag builds)
snapshot:
  version_template: "{{ .Version }}-next"

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Security"
      regexp: "^.*security[(\\w)]*:+.*$"
      order: 2
    - title: "Documentation"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 3
    - title: "Performance"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 4
    - title: "Maintenance"
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 5

# GitHub Release configuration
release:
  github:
    owner: loonghao
    name: ferrocp
  name_template: "FerroCP {{ .Version }}"
  prerelease: auto
