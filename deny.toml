# cargo-deny configuration for FerroCP.
#
# Run locally with:
#   cargo deny check
# CI should run the same command; it is the dependency gate for this workspace.

[graph]
# Audit the full feature graph so Windows-only dependencies (the `windows` and
# `wmi` trees) are covered even when checking on another platform.
all-features = true

[advisories]
version = 2
# RUSTSEC-2025-0141: `bincode` is permanently unmaintained upstream (the project
# was discontinued after a harassment incident). There is no patched release
# (`patched = []`), so the advisory fires on every version, including the 2.x
# line we now use.
#
# Accepted risk, tracked for follow-up: migrating off bincode is a wire and
# on-disk format change, so it needs an explicit owner decision and a protocol
# version bump. See the PR discussion on PIP-3199.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
version = 2
# FerroCP is Apache-2.0. Everything reachable from the dependency tree must be
# permissive and redistributeable.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Warn rather than fail on duplicate versions: the tree currently carries a few
# transitive duplicates (e.g. `windows-sys`) that cannot be unified until the
# relevant crates are bumped.
multiple-versions = "warn"
# `wildcards` is relaxed to "allow" because every wildcard in this workspace is a
# workspace-internal `path` dependency, which cannot carry a version. cargo-deny
# refuses to whitelist those for publishable crates. No registry dependency here
# uses a `*` requirement, and the committed Cargo.lock pins the resolved graph.
wildcards = "allow"

# NOTE: bincode 3.0.0 is a placeholder release whose entire source is
# `compile_error!("https://xkcd.com/2347/")`. It is already excluded by the
# `bincode = "2.0"` requirement in Cargo.toml, and the committed Cargo.lock
# pins 2.0.1. cargo-deny's `deny` list cannot be version-scoped, so the guard
# lives in Cargo.toml (see the comment there) rather than in this file.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
